<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ToDoList By Melika</title> 
        <link rel="stylesheet" href="style.css">
        <script src="main.js"></script>
    </head>
    <body>
    <section class="main">
        <div class="header">
            <div class="header__btn">
                <button type="submit" class="header__btn--right" ><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg></button>
                <button type="submit" class="header__btn--left "><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-ellipsis"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
            </div>

            
            <div class="header__title">
                <div class="header__title--text">
                    <h1>My Tasks</h1>
                </div>
                <div class="header__title--date" id="todayDate">
                </div>
            </div>
        </div>  


        <div class="content">
            <div class="contentbtn__btnmother">
            <div class="content__btn" id="contentBtn">
                <button class="content__btn--All">All</button>
                <button class="content__btn--To Do">To Do</button> 
                <button class="content__btn--Saved">Saved</button>
                <button class="content__btn--Deleted">Deleted</button>
            </div>
            </div>


            <div class="content__taskList" id="taskList">
            <ul class="content__taskList--ul" id="taskListUl">
            <li class="content__taskList--li">
                <div class="content__taskList--li--checkbox">
                    <input type="checkbox" id="taskCheckbox">
                </div>
                <div class="content__taskList--li--content">
                    <div class="content__taskList--li--text">
                        <p>Replys to the email</p>
                    </div>
                    <div class="content__taskList--li--time">
                       
                        <div class="content__taskList--li--time--icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clock"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16.5 12"/></svg>
                        </div>
                        <div class="content__taskList--li--time--text">
                            <p>3:00 PM</p>
                        </div>
                    </div>
                </div>
                <div class="content__taskList--li--btn">
                    <button type="button" class="content__taskList--li--btn--save">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bookmark"><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/></svg>
                    </button>
                    <button type="button" class="content__taskList--li--btn--delete">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
                    </button>
                </div>
            </li>
            </ul>
            </div>
            <div class="content__addTask" id="addTask">
                <button class="content__addTask--btn">+</button>
                <input  class="content__addTask--input--task" type="text"     placeholder="Add a new task...">
                <input  class="content__addTask--input--time" type="time"     id="taskTime" style="display:none">
                <button class="content__addTask--input--btn"  id="confirmBtn" onclick="addTask()" style="display:none">Add</button>
            </div>
        </div>
    </section>
   
 </body>
</html>
